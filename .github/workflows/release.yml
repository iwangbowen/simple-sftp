name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 6.1.5) — must match package.json version'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Test, Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build & Package extension
        run: npx vsce package --no-dependencies -o "simple-sftp-${{ steps.pkg.outputs.version }}.vsix"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath "simple-sftp-${{ steps.pkg.outputs.version }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract changelog for this release
        id: changelog
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## ${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt
          echo "notes_file=release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body_path: release_notes.txt
          files: simple-sftp-${{ steps.pkg.outputs.version }}.vsix
          fail_on_unmatched_files: true
